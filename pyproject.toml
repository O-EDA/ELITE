[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.13"]
build-backend = "scikit_build_core.build"

[project]
name = "elite-router"
version = "0.1.0"
description = "ELITE photonic integrated circuit routing flow"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "matplotlib>=3.7",
  "numpy>=1.24",
  "PyYAML>=6",
  "scipy>=1.10",
]

[tool.scikit-build]
cmake.build-type = "Release"
wheel.packages = ["engine"]
